name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Clone ai-intelligence (private repo) at pinned revision
        # Build provenance (MPL §3.2): the binary must trace to the exact
        # private source. Bump AI_INTELLIGENCE_REVISION at every release and
        # record it in the release body (see mpl-covered-sources/SOURCES.md).
        env:
          AI_INTELLIGENCE_REVISION: 499dcb30e67af53adee2e3e33a0eb4eb11626653
        run: git clone https://oauth2:${{ secrets.GH_PAT }}@github.com/skkut/ai-intelligence.git ai-intelligence && git -C ai-intelligence checkout $AI_INTELLIGENCE_REVISION

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install ai-intelligence dependencies
        run: npm install --prefix ai-intelligence

      - name: Install dependencies
        run: npm ci

      - name: Build and Publish Electron App
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
